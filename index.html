<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Console - Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .cloud-card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .form-control, .form-select {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f172a;
      border-color: #38bdf8;
      color: #f8fafc;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .btn-cloud {
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      border: none;
      transition: background 0.3s;
    }
    .btn-cloud:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <div class="cloud-card">
    <div class="text-center mb-4">
      <h3 class="fw-bold mb-1 text-white">Cloud Console</h3>
      <p class="text-secondary small">Register for Cloud & DevOps Environment</p>
    </div>

    <div id="statusAlert" class="alert d-none py-2 px-3 small" role="alert"></div>

    <form id="cloudForm" novalidate>
      <div class="mb-3">
        <label for="devName" class="form-label small text-secondary">Engineer Name</label>
        <input type="text" class="form-control" id="devName" placeholder="Rahul" required>
      </div>

      <div class="mb-3">
        <label for="devEmail" class="form-label small text-secondary">Work Email</label>
        <input type="email" class="form-control" id="devEmail" placeholder="rahul@cloud.com" required>
      </div>

      <div class="mb-3">
        <label for="cloudRole" class="form-label small text-secondary">Specialization</label>
        <select class="form-select" id="cloudRole" required>
          <option value="" selected disabled>Select Specialization</option>
          <option value="AWS Cloud Architecture">AWS Cloud Architecture</option>
          <option value="DevOps & CI/CD Pipelines">DevOps & CI/CD Pipelines</option>
          <option value="Cloud Security & SOC">Cloud Security & SOC</option>
          <option value="Kubernetes & Containerization">Kubernetes & Containers</option>
        </select>
      </div>

      <button type="submit" class="btn btn-cloud w-100 py-2 mt-2">Provision Access</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
